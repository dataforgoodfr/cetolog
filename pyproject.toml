[project]
name = "cetolog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
demo = [
    "gradio>=5",
    "pandas>=2",
    "scikit-learn>=1.5",
]
dev = [
    "moto[s3]>=5.2.5",
    "numpy>=2.0",
    "pandas>=2",
    "pytest>=9.2.0",
    "scikit-learn>=1.5",
]
ml = [
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "timm>=1.0.20",
    "torch>=2.6",
    "torchvision>=0.21",
]
notebook = [
    "geopandas>=1.2.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
]
# 0.24 introduit les champs média multiples : la photo d'historique,
# celle du bon dauphin, et celle du premier candidat.
review = [
    "fiftyone>=0.24",
    # 4.11+ arm64 wheels require macOS 13. 4.10 is the last
    # release with a macosx_11_0_arm64 wheel, so this machine
    # (macOS 12) can still install the review group.
    "opencv-python-headless>=4.10,<4.11",
]
pipeline = [
    "boto3>=1.43.123",
    "pillow>=11.0.0",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # tri des imports
    "UP",      # syntaxe moderne (py312)
    "B",       # bugbear
    "SIM",     # simplifications
    "C4",      # compréhensions
    "PIE",
    "RET",
    "NPY",     # numpy
    "PT",      # style pytest
    "RUF",
]
# Typographie française des textes et commentaires : tiret demi-cadratin, apostrophe, espace insécable.
allowed-confusables = ["–", "’", " "]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
