repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # Ruff version.
    rev: "v0.2.1"
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-added-large-files
        args: [--maxkb=5000]
  - repo: local
    hooks:
      - id: forbid-env-files
        name: refuser les fichiers .env
        language: fail
        entry: "Fichier .env interdit dans Git : il contient les accès au bucket."
        files: '(^|/)\.env(\.(?!example$)[^/]+)?$'
      - id: forbid-project-data
        name: refuser les données du projet
        language: fail
        entry: "Données interdites dans Git : elles restent dans data/ ou sur le bucket."
        files: '(^data/|\.(zip|npy|csv|xlsx)$)'
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
