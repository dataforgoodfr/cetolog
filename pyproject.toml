[project]
name = "cetolog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
]
pipeline = [
    "boto3>=1.43.123",
    "pillow>=13.0.0",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
